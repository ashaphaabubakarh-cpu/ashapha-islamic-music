name: ashapa_music
description: Ashapa Music - Islamic Nasheed streaming & download app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.15

  # Audio playback
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  just_audio_background: ^0.0.1-beta.11

  # State management
  provider: ^6.1.1

  # Utilities
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  dio: ^5.4.1
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.2.0
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
